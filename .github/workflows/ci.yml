name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install torch==2.5.1 pytest==8.3.5
      - name: Compile source
        run: python -m compileall -q -x '(^|/)(\.git|\.venv)/' .
      - name: Run model tests
        run: python -m pytest -q
